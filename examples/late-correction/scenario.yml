project: ../orders
model: fct_orders
key: [order_id]
sources:
  raw.orders:
    order_id: BIGINT
    order_date: DATE
    updated_at: TIMESTAMP
    amount_cents: BIGINT
vars:
  mode: broken_merge
steps:
  - name: initial orders
    snapshots:
      raw.orders: start.csv
    vars:
      as_of: '2026-03-11T00:00:00'
  - name: late correction
    snapshots:
      raw.orders: corrected.csv
    vars:
      as_of: '2026-03-15T00:00:00'
  - name: retry correction
    retry: true
